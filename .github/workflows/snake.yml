name: GitHub Snake Game (Auto Refresh)

on:
  # Runs once every 24 hours (midnight UTC)
  schedule:
    - cron: "0 0 * * *"

  # Manual trigger
  workflow_dispatch:

  # Optional: regenerate on profile updates
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Generate snake SVG + GIF
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: YOUR_USERNAME   # <-- hardcode this

          outputs: |
            dist/github-snake.svg?cache=${{ github.run_id }}
            dist/github-snake-dark.svg?palette=github-dark&cache=${{ github.run_id }}
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&cache=${{ github.run_id }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Deploy to 'output' branch (GitHub Pages)
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "auto: update snake animation"
